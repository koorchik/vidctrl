name: vidctrl
description: "Batch video converter for everyday tasks: a friendly front end for FFmpeg."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  args: ^2.7.0
  desktop_drop: ^0.8.4
  ffi: ^2.2.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  intl: any
  json_rpc_2: ^4.1.0
  path: ^1.9.1
  path_provider: ^2.1.6
  stream_channel: ^2.1.4
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    # Fixed-width font for showing commands; generic "monospace" does not
    # resolve to one on every Linux desktop. SIL Open Font License, see
    # assets/fonts/JetBrainsMono-OFL.txt.
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
    # The interface font is bundled so text takes the same room on every
    # computer; the layout is sized to fit without scrolling. Apache License
    # 2.0, see assets/fonts/Roboto-LICENSE.txt.
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
  # Licence texts for the licences page (lib/app/licenses.dart).
  assets:
    - assets/app_icon.png
    - assets/licenses/
    - assets/fonts/Roboto-LICENSE.txt
    - assets/fonts/JetBrainsMono-OFL.txt
  # Generates lib/l10n/app_localizations*.dart from the ARB files (see l10n.yaml).
  generate: true
