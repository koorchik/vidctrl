name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            target: linux
          - name: Windows
            os: windows-latest
            target: windows
          - name: macOS
            os: macos-latest
            target: macos

    steps:
      - uses: actions/checkout@v4

      # A tag such as v1.2.0 or v1.2.0-beta.1 makes a release: the app is
      # given the tag's version and the archives are named after it. Any
      # other build is "dev".
      - name: Work out the version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::The tag $GITHUB_REF_NAME is not a version such as v1.2.0 or v1.2.0-beta.1."
              exit 1
            fi
            # The app's own version takes numbers only; the part after a
            # hyphen stays in the tag and the file names.
            echo "build_args=--build-name=${version%%-*} --build-number=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          else
            version=dev
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      # FFmpeg here is only for the FFmpeg check. The app does not bundle
      # FFmpeg yet; see docs/ROADMAP.md.
      - name: Install build tools and FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev ffmpeg

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      # The full build: the smaller "ffmpeg" package has no AV1 encoder
      # (libsvtav1), which the FFmpeg check asks for.
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg-full -y --no-progress

      - run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test --exclude-tags "ffmpeg || screenshots"

      # A quick check that this system's FFmpeg can do what the app asks of
      # it: found, the needed encoders there, one short clip converted. The
      # real conversions of every goal (flutter test --tags ffmpeg) are
      # minutes of encoding and are run on a developer's machine, not here.
      - name: FFmpeg check
        run: flutter test --tags ffmpeg_check

      - name: Build
        run: flutter build ${{ matrix.target }} --release ${{ steps.version.outputs.build_args }}

      # Unpacks to a folder named after the app and its version.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        env:
          NAME: vidctrl-${{ steps.version.outputs.version }}
        run: |
          tar -C build/linux/x64/release --transform "s,^bundle,$NAME," \
            -czf "$NAME-linux-x64.tar.gz" bundle

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath vidctrl-${{ steps.version.outputs.version }}-windows-x64.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/VidCtrl.app vidctrl-${{ steps.version.outputs.version }}-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: vidctrl-${{ matrix.target }}
          path: |
            vidctrl-*.tar.gz
            vidctrl-*.zip
          if-no-files-found: error

  # Pushing a version tag publishes a release with the three archives, once
  # every system has passed its checks and built:
  #
  #   git tag v1.2.0 && git push origin v1.2.0
  #
  # A tag with a hyphen (v1.2.0-beta.1) is published as a pre-release.
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # With the whole history and its tags: the notes list what was
      # committed since the release before.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write the release notes
        run: tool/release_notes.sh "$GITHUB_REF_NAME" > notes.md

      # Running the job again for the same tag replaces the files of the
      # release that is already there.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "${GITHUB_REF_NAME#v}" \
              --notes-file notes.md \
              --verify-tag $PRERELEASE
          fi
