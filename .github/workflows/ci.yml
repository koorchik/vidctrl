name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux download needs system libraries (glibc, GTK) at least
          # as new as the ones it was built with, so it is built on an older
          # Ubuntu, not on the newest one that ubuntu-latest moves to.
          - name: Linux
            os: ubuntu-24.04
            target: linux
          - name: Windows
            os: windows-latest
            target: windows
          - name: macOS
            os: macos-latest
            target: macos

    steps:
      - uses: actions/checkout@v7

      # A tag such as v1.2.0 or v1.2.0-beta.1 makes a release: the app is
      # given the tag's version and the archives are named after it. Any
      # other build is "dev".
      - name: Work out the version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::The tag $GITHUB_REF_NAME is not a version such as v1.2.0 or v1.2.0-beta.1."
              exit 1
            fi
            # The app's own version takes numbers only; the part after a
            # hyphen stays in the tag and the file names. The whole version
            # and the repository go in too, for the app to show and to look
            # for a newer release with (lib/app/build_info.dart).
            echo "build_args=--build-name=${version%%-*} --build-number=$GITHUB_RUN_NUMBER --dart-define=VIDCTRL_VERSION=$version --dart-define=VIDCTRL_REPOSITORY=$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"
          else
            version=dev
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      # The FFmpeg the app ships with, pinned in the script. The build puts
      # it inside the app, and it goes first on the PATH, so the FFmpeg
      # check below tests it rather than the runner's own.
      - name: Fetch FFmpeg
        shell: bash
        run: |
          tool/fetch_ffmpeg.sh ${{ matrix.target }}
          echo "${{ github.workspace }}/third_party/ffmpeg/${{ matrix.target }}" >> "$GITHUB_PATH"

      - run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool bin

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test --exclude-tags "ffmpeg || screenshots"

      # A quick check that the bundled FFmpeg can do what the app asks of
      # it: found, the needed encoders there, one short clip converted. The
      # real conversions of every goal (flutter test --tags ffmpeg) are
      # minutes of encoding and are run on a developer's machine, not here.
      - name: FFmpeg check
        run: flutter test --tags ffmpeg_check

      - name: Build
        run: flutter build ${{ matrix.target }} --release ${{ steps.version.outputs.build_args }}

      # vidctrl-client, the program that lets a script or an AI agent drive
      # the window, goes where it finds the app: in the Linux bundle, beside
      # the Windows .exe, and on macOS into the app, by Package (macOS).
      - name: Build the client
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            linux) folder=build/linux/x64/release/bundle ;;
            windows) folder=build/windows/x64/runner/Release ;;
            macos) folder=build/client && mkdir -p "$folder" ;;
          esac
          tool/build_client.sh "$folder"

      # Unpacks to a folder named after the app and its version.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        env:
          NAME: vidctrl-${{ steps.version.outputs.version }}
        run: |
          tar -C build/linux/x64/release --transform "s,^bundle,$NAME," \
            -czf "$NAME-linux-x64.tar.gz" bundle

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath vidctrl-${{ steps.version.outputs.version }}-windows-x64.zip

      # The Developer ID certificate and the App Store Connect API key for
      # notarization, from the repository's secrets. Without them (a fork, a
      # pull request, or until the Apple account is set up) the app is signed
      # ad hoc and not notarized, and the release notes say how to open it.
      - name: Signing keys (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [[ -z "$MACOS_CERT_P12" || -z "$NOTARY_KEY_P8" ]]; then
            echo "No signing keys: the app is signed ad hoc and not notarized."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          if [[ -z "$identity" ]]; then
            echo "::error::MACOS_CERT_P12 holds no Developer ID Application certificate."
            exit 1
          fi
          echo "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          {
            echo "MACOS_SIGN_IDENTITY=$identity"
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8"
            echo "NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "NOTARY_ISSUER_ID=$NOTARY_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: tool/package_macos.sh vidctrl-${{ steps.version.outputs.version }}-macos.dmg build/client/vidctrl-client

      # The packed app runs the FFmpeg inside it, not the PATH's, and has
      # the client beside its own executable.
      - name: Check the FFmpeg and the client inside the app
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            linux) app=build/linux/x64/release/bundle; bin=$app/lib/ffmpeg ;;
            windows) app=build/windows/x64/runner/Release; bin=$app ;;
            macos) app=build/macos/Build/Products/Release/VidCtrl.app/Contents/MacOS; bin=$app ;;
          esac
          "$bin/ffmpeg" -hide_banner -version | head -1
          "$bin/ffprobe" -hide_banner -version | head -1
          "$app/vidctrl-client" --help > "$RUNNER_TEMP/client-help.txt"
          head -1 "$RUNNER_TEMP/client-help.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: vidctrl-${{ matrix.target }}
          path: |
            vidctrl-*.tar.gz
            vidctrl-*.zip
            vidctrl-*.dmg
          if-no-files-found: error

  # Pushing a version tag publishes a release with the three archives, once
  # every system has passed its checks and built:
  #
  #   git tag v1.2.0 && git push origin v1.2.0
  #
  # A tag with a hyphen (v1.2.0-beta.1) is published as a pre-release.
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # With the whole history and its tags: the notes list what was
      # committed since the release before.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The macOS build is notarized exactly when the signing secrets are
      # there (it fails if they are there and notarization does not pass).
      - name: Write the release notes
        env:
          MACOS_NOTARIZED: ${{ secrets.MACOS_CERT_P12 != '' && secrets.NOTARY_KEY_P8 != '' }}
        run: tool/release_notes.sh "$GITHUB_REF_NAME" > notes.md

      # Running the job again for the same tag replaces the files of the
      # release that is already there.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "${GITHUB_REF_NAME#v}" \
              --notes-file notes.md \
              --verify-tag $PRERELEASE
          fi
